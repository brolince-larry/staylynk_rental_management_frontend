server {
    listen 80;
    server_name _;

    # Belt-and-suspenders alongside the <meta name="robots"> tag —
    # covers any response this app serves, not just index.html.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /usr/share/nginx/html;
    index index.html;

    # Internal healthcheck endpoint — used by Docker HEALTHCHECK, not public traffic.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache immutable hashed assets aggressively.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # SPA fallback — client-side routing (React Router) handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
